<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ListoFast — Importa lista</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F1F8E9;
    color: #1B1B1B;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .emoji { font-size: 56px; line-height: 1; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; color: #283593; }
  p { font-size: 16px; line-height: 1.5; color: #3A3A3A; margin: 0 0 20px; }
  .note {
    font-size: 13px;
    color: #757575;
    background: #F5F5F5;
    border-radius: 12px;
    padding: 12px 14px;
    margin: 0 0 24px;
    text-align: left;
  }
  .cta {
    display: inline-block;
    background: #43A047;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 16px;
    font-size: 16px;
  }
  .cta:active { opacity: 0.85; }
  @media (prefers-color-scheme: dark) {
    body { background: #10140F; color: #EDEDED; }
    .card { background: #1B1F17; box-shadow: none; }
    h1 { color: #9FA8DA; }
    p { color: #C8C8C8; }
    .note { background: #24261F; color: #AFAFAF; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🛒</div>
    <h1>Hai ricevuto una nuova lista della spesa</h1>
    <p>
      Installa ListoFast per poter aggiungere la lista nella tua app, pronta da
      spuntare man mano che fai la spesa per non dimenticarti niente.
    </p>
    <a class="cta" href="https://play.google.com/store/apps/details?id=com.gdd.listofast">
      Scarica ListoFast dal Play Store
    </a>
  </div>
</body>
</html>
